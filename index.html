      .premium-card::before {
        content: '';

        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, var(--primary), var(--secondary));

      }

      .premium-card:hover {

      .premium-card:hover::before {

      }

      /* Animated Gradient Text */
      .gradient-text {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);

        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: gradientShift 4s ease infinite;
      }

      @keyframes gradientShift {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }

      /* Animations */
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
      }

      .float {
        animation: float 6s ease-in-out infinite;
      }

      @keyframes pulse-slow {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }

      .pulse-slow {
        animation: pulse-slow 3s ease-in-out infinite;
      }

      @keyframes glow {
        0%, 100% {

      }

      .glow {
        animation: glow 2s ease-in-out infinite;
      }

      @keyframes bounce {
        0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-30px); }
        60% { transform: translateY(-15px); }
      }

      .bounce {
        animation: bounce 2s ease infinite;
      }

      @keyframes zoomIn {
        from { opacity: 0; transform: scale(0.3); }
        50% { opacity: 1; }
        to { transform: scale(1); }
      }

      .zoom-in {
        animation: zoomIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
      }

      @keyframes flipIn {
        from { transform: perspective(400px) rotateY(90deg); opacity: 0; }
        to { transform: perspective(400px) rotateY(0); opacity: 1; }
      }

      .flip-in {
        animation: flipIn 0.8s ease-out forwards;
      }

      @keyframes slideUpBounce {
        0% { opacity: 0; transform: translateY(100px); }
        60% { transform: translateY(-20px); }
        80% { transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      .slide-up-bounce {
        animation: slideUpBounce 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
      }

      @keyframes rotateIn {
        from { transform: rotate(-200deg) scale(0); opacity: 0; }
        to { transform: rotate(0) scale(1); opacity: 1; }
      }

      .rotate-in {
        animation: rotateIn 0.8s ease-out forwards;
      }

      @keyframes sparkle {
        0%, 100% { opacity: 1; transform: scale(1) rotate(0deg); }
        25% { opacity: 0.8; transform: scale(1.2) rotate(90deg); }
        50% { opacity: 1; transform: scale(0.8) rotate(180deg); }
        75% { opacity: 0.8; transform: scale(1.1) rotate(270deg); }
      }

      .sparkle {
        animation: sparkle 2s ease-in-out infinite;
      }

      @keyframes wave {
        0%, 100% { transform: translateY(0); }
        25% { transform: translateY(-10px); }
        75% { transform: translateY(10px); }
      }

      .wave-1 { animation: wave 1.5s ease-in-out infinite; animation-delay: 0s; }
      .wave-2 { animation: wave 1.5s ease-in-out infinite; animation-delay: 0.1s; }
      .wave-3 { animation: wave 1.5s ease-in-out infinite; animation-delay: 0.2s; }
      .wave-4 { animation: wave 1.5s ease-in-out infinite; animation-delay: 0.3s; }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(60px); }
        to { opacity: 1; transform: translateY(0); }
      }

        animation: fadeInUp 0.8s ease-out forwards;

        overflow-y: auto; /* Enable scrolling for mobile */
        overflow-x: hidden;
        height: 100vh;
      }

        content: '';

        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);

                    { "quarter": "3분기", "period": "9-11월", "task": "중간 점검 및 보완", "color": "#F59E0B" },
                    { "quarter": "4분기", "period": "12-2월", "task": "효과 측정 및 피드백", "color": "#EC4899" }
          ],
          "goal": { "currentScore": 4.31, "targetScore": 4.32, "currentRank": 0, "targetRank": 0, "totalSchools": 0 }
        });

        // LocalStorage Keys
        const STORAGE_KEY = 'schoolEvaluationData_v2';
        
        // Load data from localStorage
        const loadFromStorage = () => {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    // Migration checks
                    if (!parsed.responseRates) {
                        parsed.responseRates = { teacher: 100, student: 100, parent: 100, staff: 100 };
                    }
                    return parsed;
                }
            } catch (e) {
                console.error('Failed to load from localStorage:', e);
            }
            return null;
        };
        
        // Save data to localStorage
        const saveToStorage = (data) => {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                return true;
            } catch (e) {
                console.error('Failed to save to localStorage:', e);
                return false;
            }
        };

        // Excel Parser Functions
        const parseExcelFile = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                        resolve(jsonData);
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        };

        // Parse respondent file (교원/학생/학부모/직원)
        const parseRespondentFile = (data, type) => {
            const result = {
                respondentCount: 0,
                averageScore: 0,
                highestScore: 0,
                lowestScore: 5,
                highestItem: { title: '', score: 0 },
                lowestItem: { title: '', score: 5 },
                topItems: [],
                bottomItems: [],
                subCategoryScores: {},      // 세부영역별 현재 점수
                subCategoryScoresPrev: {},  // 세부영역별 전년도 점수
                allItems: []
            };
            
            // 총 응답인원 찾기 (행 0, 열 10)
            if (data[0] && data[0][10] !== undefined && typeof data[0][10] === 'number') {
                result.respondentCount = data[0][10];
            }
            
            // 응답인원을 못 찾으면 다른 방법으로 시도
            if (result.respondentCount === 0) {
                for (let i = 0; i < Math.min(3, data.length); i++) {
                    for (let j = 8; j < 12; j++) {
                        const cell = data[i] && data[i][j];
                        if (typeof cell === 'number' && cell >= 10 && cell <= 2000) {
                            result.respondentCount = cell;
                            break;
                        }
                    }
                    if (result.respondentCount > 0) break;
                }
            }

            let currentCategory = '';
            let currentSubCategory = '';
            let scores = [];
            let subCategoryItemScores = {};  // 세부영역별 문항 점수들
            
            // 행 3부터 데이터 파싱 (응답인원 행만 처리)
            for (let i = 3; i < data.length; i++) {
                const row = data[i];
                if (!row || row.length < 11) continue;
                
                // 열 4가 '응답인원'인 행만 처리
                const col4 = row[4];
                if (!col4 || String(col4).trim() !== '응답인원') continue;
                
                // 영역 (열 0)
                const col0 = row[0];
                if (col0 && typeof col0 === 'string' && col0.length > 0) {
                    currentCategory = col0.replace(/[\n\r]/g, ' ').trim();
                }
                
                // 세부영역 (열 1)
                const col1 = row[1];
                if (col1 && typeof col1 === 'string' && col1.length > 0) {
                    currentSubCategory = col1.replace(/[\n\r]/g, ' ').trim();
                }
                
                // 질문 텍스트 (열 3)
                const questionText = row[3];
                if (!questionText || typeof questionText !== 'string') continue;
                
                // 점수 (열 10)
                const score = row[10];
                if (typeof score !== 'number' || score < 1 || score > 5) continue;
                
                // 2024년도 점수 (열 12)
                const prevScore = row[12];
                
                // 세부영역별 점수 수집
                if (currentSubCategory) {
                    if (!subCategoryItemScores[currentSubCategory]) {
                        subCategoryItemScores[currentSubCategory] = { current: [], prev: [] };
                    }
                    subCategoryItemScores[currentSubCategory].current.push(score);
                    if (typeof prevScore === 'number' && prevScore >= 1 && prevScore <= 5) {
                        subCategoryItemScores[currentSubCategory].prev.push(prevScore);
                    }
                }
                
                // 질문 텍스트 정리
                const cleanQuestion = questionText.split('\n')[0].replace(/^\d+\.\s*/, '').trim();
                
                if (cleanQuestion.length > 5) {
                    const item = {
                        title: cleanQuestion.length > 60 ? cleanQuestion.substring(0, 60) + '...' : cleanQuestion,
                        score: parseFloat(score.toFixed(2)),
                        category: currentCategory,
                        subCategory: currentSubCategory
                    };
                    
                    result.allItems.push(item);
                    scores.push(score);
                    
                    if (score > result.highestScore) {
                        result.highestScore = score;
                        result.highestItem = item;
                    }
                    if (score < result.lowestScore) {
                        result.lowestScore = score;
                        result.lowestItem = item;
                    }
                }
            }
            
            // 세부영역별 평균 점수 계산
            for (const [subCat, itemScores] of Object.entries(subCategoryItemScores)) {
                if (itemScores.current.length > 0) {
                    result.subCategoryScores[subCat] = parseFloat(
                        (itemScores.current.reduce((a, b) => a + b, 0) / itemScores.current.length).toFixed(2)
                    );
                }
                if (itemScores.prev.length > 0) {
                    result.subCategoryScoresPrev[subCat] = parseFloat(
                        (itemScores.prev.reduce((a, b) => a + b, 0) / itemScores.prev.length).toFixed(2)
                    );
                }
            }
            
            // 전체 평균 점수 계산
            if (scores.length > 0) {
                result.averageScore = parseFloat((scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(2));
            }
            
            // TOP 3 / 하위 3 정렬
            const sortedItems = [...result.allItems].sort((a, b) => b.score - a.score);
            result.topItems = sortedItems.slice(0, 3);
            result.bottomItems = [...result.allItems].sort((a, b) => a.score - b.score).slice(0, 3);
            
            // 점수 반올림
            result.highestScore = parseFloat(result.highestScore.toFixed(2));
            result.lowestScore = result.lowestScore < 5 ? parseFloat(result.lowestScore.toFixed(2)) : 0;
            
            console.log(`Parsed ${type}: count=${result.respondentCount}, avg=${result.averageScore}, items=${result.allItems.length}`);
            console.log(`Sub-category scores:`, result.subCategoryScores);
            
            return result;
        };

        // Parse trend file (연도별 추이)
        const parseTrendFile = (data) => {
            const result = [];
            
            for (let i = 2; i < data.length; i++) {
                const row = data[i];
                if (!row || row.length < 5) continue;
                
                const yearCell = row[0];
                if (!yearCell) continue;
                
                // 년도 추출 (예: "2025년" -> "2025")
                const yearMatch = String(yearCell).match(/(\d{4})/);
                if (yearMatch) {
                    const year = yearMatch[1];
                    const teacher = parseFloat(row[1]) || 0;
                    const student = parseFloat(row[2]) || 0;
                    const parent = parseFloat(row[3]) || 0;
                    const staff = parseFloat(row[4]) || 0;
                    
                    // 전체 평균 계산 (단순 평균)
                    const overall = parseFloat(((teacher + student + parent + staff) / 4).toFixed(2));
                    
                    result.push({
                        year,
                        teacher: parseFloat(teacher.toFixed(2)),
                        student: parseFloat(student.toFixed(2)),
                        parent: parseFloat(parent.toFixed(2)),
                        staff: parseFloat(staff.toFixed(2)),
                        overall
                    });
                }
            }
            
            // 년도순 정렬
            result.sort((a, b) => parseInt(a.year) - parseInt(b.year));
            
            // 최근 4개년만 유지
            const finalResult = result.slice(-4);
            
            return finalResult;
        };

        // Generate AI Insights based on data
        const generateAIInsights = (teacherData, studentData, parentData, staffData) => {
            const insights = [];
            
            // Find achievements
            if (teacherData.topItems.length > 0) {
                insights.push({
                    type: 'achievement',
                    title: '🏆 교원 최고 성과',
                    content: `${teacherData.topItems[0].title.substring(0, 40)}...이(가) ${teacherData.topItems[0].score}점으로 교원 평가 최고 만족도를 기록했습니다.`
                });
            }
            
            // Staff improvement
            if (staffData.averageScore > 0) {
                insights.push({
                    type: 'achievement',
                    title: '🏆 직원 평가',
                    content: `직원 만족도가 ${staffData.averageScore}점으로 측정되었습니다.`
                });
            }
            
            // Find improvements needed
            if (teacherData.bottomItems.length > 0) {
                insights.push({
                    type: 'improvement',
                    title: '⚠️ 개선 필요 (교원)',
                    content: `${teacherData.bottomItems[0].title.substring(0, 40)}...이(가) ${teacherData.bottomItems[0].score}점으로 교원 평가 중 가장 낮습니다.`
                });
            }
            
            if (studentData.bottomItems.length > 0) {
                insights.push({
                    type: 'improvement',
                    title: '⚠️ 개선 필요 (학생)',
                    content: `${studentData.bottomItems[0].title.substring(0, 40)}...이(가) ${studentData.bottomItems[0].score}점으로 학생 평가 중 가장 낮습니다.`
                });
            }
            
            // Action item
            insights.push({
                type: 'action',
                title: '🎯 즉시 조치',
                content: '낮은 만족도 항목에 대한 개선 계획 수립이 필요합니다.'
            });
            
            return insights;
        };

        // Generate Action Items
        const generateActionItems = (teacherData, studentData) => {
            const items = [];
            
            if (studentData.bottomItems.length > 0) {
                items.push({
                    priority: 1,
                    title: '학생 만족도 개선',
                    details: [studentData.bottomItems[0].title.substring(0, 30) + '... 개선', '학생 의견 수렴 확대'],
                    icon: '🎯'
                });
            }
            
            if (teacherData.bottomItems.length > 0) {
                items.push({
                    priority: 2,
                    title: '교원 지원 강화',
                    details: [teacherData.bottomItems[0].title.substring(0, 30) + '... 개선', '교원 의견 반영'],
                    icon: '💬'
                });
            }
            
            items.push({
                priority: 3,
                title: '우수 프로그램 확대',
                details: ['높은 만족도 프로그램 유지', '성공 사례 공유'],
                icon: '📚'
            });
            
            return items;
        };

        // Custom Hook: useCountUp
        const useCountUp = (end, start = 0, duration = 2000, decimals = 2) => {
            const [count, setCount] = useState(start);
            const animationFrameId = useRef(null);
            
            useEffect(() => {
                let frame = 0;
                const totalFrames = Math.round(duration / (1000 / 60));
                const easeOutExpo = t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
                
                const counter = () => {
                    frame++;
                    const progress = easeOutExpo(frame / totalFrames);
                    const currentCount = start + (end - start) * progress;
                    setCount(parseFloat(currentCount.toFixed(decimals)));
                    
                    if (frame < totalFrames) {
                        animationFrameId.current = requestAnimationFrame(counter);
                    } else {
                        setCount(end);
                    }
                };
                
                animationFrameId.current = requestAnimationFrame(counter);
                
                return () => {
                    if (animationFrameId.current) {
                        cancelAnimationFrame(animationFrameId.current);
                    }
                };
            }, [end, start, duration, decimals]);
            
            return count;
        };

        // Icons
        const SchoolIcon = () => (
            <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/>
                <path d="M5 13.18v4L12 21l7-3.82v-4"/>
            </svg>
        );

        const SparkleIcon = () => (
            <svg className="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/>
            </svg>
        );

        // Premium Chart Components
        const PremiumPieChart = ({ data }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (canvasRef.current) {
                    const ctx = canvasRef.current.getContext('2d');
                    
                    if (chartRef.current) {
                        chartRef.current.destroy();
                    }

                    chartRef.current = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: data.map(d => d.name),

                                borderColor: '#ffffff',

                                hoverOffset: 15,

                        options: {

                            maintainAspectRatio: false,

                            }
                        }

                return () => {

            return (
                <div className="flex items-center justify-center w-full h-64 md:h-80 lg:h-96">
                    <canvas ref={canvasRef}></canvas>

            );
        };

        const PremiumBarChart = ({ data }) => {

            const chartRef = useRef(null);

            useEffect(() => {
                if (canvasRef.current) {
                    const ctx = canvasRef.current.getContext('2d');
                    
                    if (chartRef.current) {
                        chartRef.current.destroy();
                    }

                    const currentYear = data[0] ? Object.keys(data[0]).find(k => k !== 'name' && k !== '2024') : '2025';

                                        gradient.addColorStop(0, '#818CF8');
                                        gradient.addColorStop(1, '#6366F1');
                                        return gradient;
                                    },

                        options: {

                                    position: 'top',
                                    labels: {

                                        font: { size: 12, weight: '500' }
                                    }
                                },
                                tooltip: {
                                    backgroundColor: 'rgba(15, 23, 42, 0.95)',
                                    titleFont: { size: 14, weight: 'bold' },

                                    padding: 12,
                                    cornerRadius: 12,
                                }
                            },
                            scales: {

                                },
                                x: {

                            }

                }

                return () => {

            return <canvas ref={canvasRef}></canvas>;
        };

        // Premium Splash Screen
        const PremiumSplashScreen = ({ onFinished, schoolData }) => {

                    });

            const totalParticipants = schoolData.kpiData.find(k => k.title === '총 참여 인원')?.value || 0;

                    onClick={onDetailClick}
                >
                    <div className="flex justify-between items-start mb-4 md:mb-6">
                        <div>
                            <p className="text-xs md:text-sm font-semibold text-gray-500 uppercase tracking-wider mb-1 md:mb-2">
                                {data.title}
                            </p>
                            <div className="flex items-baseline gap-2 flex-wrap">
                                <span className="text-3xl md:text-5xl font-black text-gray-900 number-counter">
                                    {animatedValue.toLocaleString(undefined, { 
                                        minimumFractionDigits: data.total ? 2 : (data.unit === '%' ? 1 : 0), 
                                        maximumFractionDigits: data.total ? 2 : (data.unit === '%' ? 1 : 0)
                                    })}
                                </span>
                                {data.total && (
                                    <span className="text-xl md:text-2xl font-bold text-gray-400">
                                        /{data.total.toFixed(2)}
                                    </span>
                                )}
                                {data.unit && (
                                    <span className="text-xl md:text-2xl font-bold text-gray-400">{data.unit}</span>
                                )}
                            </div>
                        </div>
                        <div className="text-4xl md:text-5xl pulse-slow">
                            {data.icon}
                        </div>
                    </div>
                    <div className="flex items-center gap-2">
                        <span className={`inline-flex items-center px-2 py-1 md:px-3 md:py-1 rounded-full text-xs md:text-sm font-bold ${
                            data.change >= 0 ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'
                        }`}>
                            {data.change >= 0 ? '▲' : '▼'} {data.change > 0 ? '+' : ''}{typeof data.change === 'number' ? data.change.toFixed(2) : data.change}
                        </span>
                        <span className="text-xs md:text-sm text-gray-500">전년 대비</span>
                    </div>
                </div>
            );
        };

        // Category Chart Card
        const CategoryChartCard = ({ data, academicYear }) => {
            return (
                <div className="glass-white rounded-3xl p-6 md:p-8 h-full fade-in-up" style={{ animationDelay: '300ms' }}>
                    <div className="flex flex-col md:flex-row items-start md:items-center justify-between mb-6 md:mb-8 gap-4">
                        <div>
                            <h3 className="text-xl md:text-2xl font-bold text-gray-900 mb-1 md:mb-2">카테고리별 만족도</h3>
                            <p className="text-sm md:text-base text-gray-500">{parseInt(academicYear) - 1} vs {academicYear} 비교 분석</p>
                        </div>
                        <div className="inline-flex items-center px-3 py-1 md:px-4 md:py-2 rounded-full text-xs md:text-sm font-bold bg-indigo-100 text-indigo-700">
                            {data.length}개 항목
                        </div>
                    </div>
                    <div className="h-64 md:h-96">
                        <PremiumBarChart data={data} />
                    </div>
                </div>
            );
        };

        // AI Insights Panel
        const PremiumAiInsightsPanel = ({ aiInsights, voices }) => {
            return (
                <div className="glass-white rounded-3xl p-6 md:p-8 h-full flex flex-col fade-in-up" style={{ animationDelay: '400ms' }}>
                    <div className="flex items-center gap-3 mb-6">
                        <div className="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center">
                            <span className="text-xl">🤖</span>
                        </div>
                        <h3 className="text-xl md:text-2xl font-bold text-gray-900">AI 인사이트</h3>
                    </div>
                    
                    <div className="flex-1 space-y-4 overflow-y-auto pr-2 mb-6 max-h-[400px] md:max-h-none">
                        {aiInsights.length > 0 ? aiInsights.map((insight, index) => (
                            <div 
                                key={index}
                                className="premium-card p-4 md:p-6 hover:shadow-2xl transition-all"
                            >
                                <h4 className="text-base md:text-lg font-bold text-gray-800 mb-2 md:mb-3 flex items-center gap-2">
                                    {insight.title}
                                </h4>
                                <p className="text-gray-600 leading-relaxed text-xs md:text-sm">
                                    {insight.content}
                                </p>
                            </div>
                        )) : (
                            <div className="text-center text-gray-500 py-8">
                                <p>데이터를 업로드하면 AI 인사이트가 생성됩니다.</p>
                            </div>
                        )}
                    </div>

                    {voices && voices.length > 0 && (
                        <div className="border-t pt-6">
                            <h4 className="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                                <span>💬</span> 생생한 목소리
                            </h4>
                            <div className="space-y-3">
                                {voices.map((voice, index) => (
                                    <div key={index} className="bg-gradient-to-r from-indigo-50 to-purple-50 rounded-xl p-4">
                                        <p className="text-gray-800 font-medium mb-2 flex items-start gap-2 text-sm md:text-base">
                                            <span className="text-lg">{voice.emoji}</span>
                                            <span className="flex-1">{voice.text}</span>
                                        </p>
                                        <p className="text-xs md:text-sm text-gray-500 text-right">- {voice.source}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Dashboard Component
        const PremiumDashboard = ({ schoolData, onEnterPresentation, onOpenDataEditor }) => {
            
            const getResponseRate = (group) => {
                const map = { '교원': 'teacher', '학생': 'student', '학부모': 'parent', '직원': 'staff' };
                return schoolData.responseRates[map[group]] || 0;
            };

            return (
                <div className="min-h-screen pb-12">
                    <PremiumHeader 
                        schoolData={schoolData} 
                        onEnterPresentation={onEnterPresentation}
                        onOpenDataEditor={onOpenDataEditor}
                    />
                    
                    <main className="max-w-7xl mx-auto px-4 md:px-8 py-8 md:py-12">
                        {/* Hero Section */}
                        <div className="text-center mb-8 md:mb-16 fade-in-up">
                            <h2 className="display-2 text-white mb-2 md:mb-4">
                                {schoolData.academicYear} 학교 평가 리포트 
                            </h2>
                            <p className="text-base md:text-xl text-white/80 font-medium">
                                데이터 기반의 정확한 인사이트와 개선 방향
                            </p>
                        </div>

                        {/* KPI Cards */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 mb-8 md:mb-12">
                            {schoolData.kpiData.map((kpi, index) => (
                                <PremiumKpiCard 
                                    key={index}
                                    data={kpi}
                                    delay={index * 100}
                                    onDetailClick={() => onEnterPresentation(kpi.targetSlide)}
                                />
                            ))}
                        </div>

                        {/* Charts & Insights */}
                        <div className="grid grid-cols-1 lg:grid-cols-5 gap-6 mb-8 md:mb-12">
                            <div className="lg:col-span-3">
                                <CategoryChartCard data={schoolData.categoryData} academicYear={schoolData.academicYear} />
                            </div>
                            <div className="lg:col-span-2">
                                <PremiumAiInsightsPanel 
                                    aiInsights={schoolData.aiInsights}
                                    voices={schoolData.voices}
                                />
                            </div>
                        </div>

                        {/* Respondents Overview */}
                        <div className="glass-white rounded-3xl p-6 md:p-8 fade-in-up" style={{ animationDelay: '500ms' }}>
                            <h3 className="text-xl md:text-2xl font-bold text-gray-900 mb-6 md:mb-8">응답자 구성</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                                <div className="w-full max-w-sm mx-auto h-64 md:h-auto">
                                    <PremiumPieChart data={schoolData.respondentData} />
                                </div>
                                <div className="space-y-4">
                                    {schoolData.respondentData.map((item, index) => (
                                        <div key={index} className="flex items-center justify-between p-4 bg-gradient-to-r from-gray-50 to-white rounded-xl">
                                            <div className="flex items-center gap-3 md:gap-4">
                                                <div 
                                                    className="w-3 h-3 md:w-4 md:h-4 rounded-full shadow-lg"
                                                    style={{ backgroundColor: item.color }}
                                                ></div>
                                                <span className="font-semibold text-gray-800 text-sm md:text-base">{item.name}</span>
                                            </div>
                                            <div className="flex items-center gap-3 md:gap-4">
                                                <span className="text-xs font-semibold text-gray-500 bg-gray-100 px-2 py-1 rounded-md">
                                                    응답률 {getResponseRate(item.name)}%
                                                </span>
                                                <span className="text-xl md:text-3xl font-black text-gray-900 number-counter">
                                                    {item.value.toLocaleString()}
                                                    <span className="text-sm md:text-lg text-gray-500 ml-1">명</span>
                                                </span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        // ============================================
        // PRESENTATION SLIDES
        // ============================================

        const SlideWrapper = ({ children, className = '' }) => (
            <div className={`presentation-content-wrapper flex-1 w-full min-h-full flex flex-col justify-center items-center px-4 sm:px-6 md:px-8 py-3 md:py-4 ${className}`}>
                {children}
            </div>
        );

        // Unified Slide Title Component for Consistency & Large Sizing
        const SlideTitle = ({ children, subtitle }) => (
            <div className="mb-3 md:mb-5 text-center w-full shrink-0">
                <h2 className="text-3xl sm:text-4xl md:text-5xl font-black text-white tracking-tight mb-1.5 md:mb-2 drop-shadow-md">
                    {children}
                </h2>
                {subtitle && (
                    <p className="text-sm sm:text-base md:text-lg text-white/80 font-medium max-w-4xl mx-auto">
                        {subtitle}
                    </p>
                )}
            </div>
        );

        // Slide 0: Title Slide
        const TitleSlide = ({ schoolData }) => {
            const totalParticipants = schoolData.kpiData.find(k => k.title === '총 참여 인원')?.value || 0;
            return (
                <SlideWrapper className="text-center">
                    <div className="zoom-in w-full max-w-[94rem] mx-auto flex flex-col items-center">
                        <div className="inline-block p-6 md:p-10 bg-white/10 backdrop-blur-xl rounded-3xl border border-white/20 mb-8 md:mb-12 float glow">
                            <div className="w-24 h-24 md:w-40 md:h-40 text-white">
                                <SchoolIcon />
                            </div>
                        </div>
                        <h1 className="text-4xl sm:text-6xl md:text-7xl lg:text-8xl font-black text-white tracking-tight mb-4 md:mb-8 drop-shadow-lg">
                            {schoolData.academicYear} 학교 평가
                        </h1>
                        <p className="text-3xl sm:text-4xl md:text-6xl text-white/90 font-bold mb-4 md:mb-6 fade-in-up stagger-2">
                            <span className="text-yellow-300">{totalParticipants.toLocaleString()}</span>명의 이야기
                        </p>
                        <p className="text-2xl sm:text-3xl md:text-4xl text-white/70 font-medium mb-8 fade-in-up stagger-3">
                            {schoolData.semester} 분석 리포트
                        </p>
                        <div className="flex items-center justify-center gap-4 md:gap-6 text-white/70 text-xl sm:text-2xl md:text-3xl fade-in-up stagger-4">
                            <span className="sparkle">✨</span>
                            <span>데이터 기반 인사이트</span>
                            <span className="sparkle">✨</span>
                        </div>
                    </div>
                </SlideWrapper>
            );
        };

        // Slide 1: Overall Score Slide
        const OverallScoreSlide = ({ schoolData }) => {
            const overallKpi = schoolData.kpiData.find(k => k.title === '종합 만족도');
            const score = useCountUp(overallKpi.value, 0, 2500, 2);
            const percentage = useCountUp((overallKpi.value / overallKpi.total) * 100, 0, 2500, 1);
            
            return (
                <SlideWrapper className="text-center">
                    <div className="fade-in-scale w-full max-w-[94rem] mx-auto flex flex-col items-center">
                        <SlideTitle subtitle="전체 만족도 점수 현황 및 목표치 달성률">⭐ 종합 만족도</SlideTitle>
                        <div className="mb-8 md:mb-14">
                            <span className="display-1 text-white number-counter font-black glow" style={{textShadow: '0 0 60px rgba(255,255,255,0.5)'}}>
                                {score.toFixed(2)}
                            </span>
                            <span className="text-4xl sm:text-6xl md:text-7xl text-white/50 font-bold">
                                /{overallKpi.total.toFixed(1)}
                            </span>
                        </div>
                        <div className="w-full max-w-5xl mx-auto mb-8 md:mb-12 px-4">
                            <div className="h-6 md:h-10 bg-white/20 rounded-full overflow-hidden backdrop-blur-xl shadow-2xl">
                                <div 
                                    className="h-full bg-gradient-to-r from-green-400 via-emerald-400 to-teal-500 rounded-full progress-animate"
                                    style={{ width: `${percentage}%` }}
                                ></div>
                            </div>
                            <p className="text-2xl sm:text-3xl md:text-4xl text-white/85 mt-4 md:mt-6 font-bold">{percentage.toFixed(1)}% 달성</p>
                        </div>
                        <div className={`inline-block px-8 py-4 md:px-14 md:py-6 backdrop-blur-xl rounded-3xl border-2 slide-up-bounce ${overallKpi.change >= 0 ? 'bg-green-500/20 border-green-400/50' : 'bg-orange-500/20 border-orange-400/50'}`}>
                            <p className={`text-xl sm:text-3xl md:text-4xl font-bold ${overallKpi.change >= 0 ? 'text-green-300' : 'text-orange-300'}`}>
                                {overallKpi.change >= 0 ? '📈 ▲' : '📉 ▼'} 전년 대비 {overallKpi.change >= 0 ? '+' : ''}{overallKpi.change.toFixed(2)}점
                            </p>
                        </div>
                    </div>
                </SlideWrapper>
            );
        };

        // Slide 2: Participants Slide
        const ParticipantsSlide = ({ schoolData }) => {
            const total = schoolData.respondentData.reduce((sum, item) => sum + item.value, 0);
            
            return (
                <SlideWrapper className="text-center">
                    <div className="w-full max-w-[94rem] mx-auto fade-in-scale flex flex-col items-center">
                        <SlideTitle subtitle="그룹별 참여 인원 및 전체 응답자 구성 현황">👥 응답자 구성</SlideTitle>
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 md:gap-16 items-center w-full mt-2">
                            <div className="flex items-center justify-center zoom-in w-full">
                                <div className="w-72 h-72 md:w-[420px] md:h-[420px]">
                                    <PremiumPieChart data={schoolData.respondentData} />
                                </div>
                            </div>
                            <div className="space-y-4 md:space-y-6 text-left w-full">
                                {schoolData.respondentData.map((d, index) => (
                                    <div 
                                        key={index} 
                                        className={`flex items-center justify-between p-5 md:p-7 bg-white/10 backdrop-blur-xl rounded-2xl border border-white/20 slide-up-bounce card-3d`}
                                        style={{ animationDelay: `${index * 150}ms` }}
                                    >
                                        <div className="flex items-center gap-4">
                                            <div 
                                                className="w-5 h-5 md:w-8 md:h-8 rounded-full shadow-lg"
                                                style={{ backgroundColor: d.color }}
                                            ></div>
                                            <span className="text-2xl md:text-4xl font-bold text-white">{d.name}</span>
                                        </div>
                                        <span className="text-3xl md:text-5xl font-black text-white number-counter">
                                            {d.value.toLocaleString()}
                                            <span className="text-lg md:text-2xl text-white/70 ml-2">명</span>
                                        </span>
                                    </div>
                                ))}
                                <div className="mt-4 md:mt-8 p-5 md:p-7 bg-gradient-to-r from-indigo-500/30 to-purple-500/30 rounded-2xl border border-indigo-400/30 fade-in-up stagger-5">
                                    <p className="text-2xl md:text-4xl text-white font-bold text-center">
                                        총 <span className="text-4xl md:text-6xl text-yellow-300 font-black">{total.toLocaleString()}</span>명 참여 🎉
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </SlideWrapper>
            );
        };

        // Slide 3: Response Rate Slide
        const ResponseRateSlide = ({ schoolData }) => {
            const { responseRates, respondentData } = schoolData;
            
            const groups = [
                { id: 'teacher', name: '교원', color: '#6366F1', icon: '👨‍🏫' },
                { id: 'student', name: '학생', color: '#EC4899', icon: '🎓' },
                { id: 'parent', name: '학부모', color: '#10B981', icon: '👪' },
                { id: 'staff', name: '직원', color: '#F59E0B', icon: '💼' }
            ];

            return (
                <SlideWrapper className="text-center">
                    <div className="w-full max-w-[94rem] mx-auto fade-in-up flex flex-col justify-center">
                        <SlideTitle subtitle="각 주체별 대상자 대비 실제 설문 응답 완료 비율">📊 그룹별 실제 응답률</SlideTitle>
                        
                        <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 md:gap-5 mt-3 md:mt-4">
                            {groups.map((group, index) => {
                                const rate = responseRates[group.id] || 0;
                                const animatedRate = useCountUp(rate, 0, 1500, 1);
                                const respondentCount = respondentData?.find(r => r.name.includes(group.name))?.value;
                                
                                return (
                                    <div 
                                        key={group.id}
                                        className="bg-white/10 backdrop-blur-xl rounded-2xl md:rounded-3xl p-5 md:p-7 border border-white/20 slide-up-bounce card-3d flex flex-col justify-between min-h-[280px] md:min-h-[340px]"
                                        style={{ animationDelay: `${index * 150}ms` }}
                                    >
                                        <div className="flex flex-col items-center">
                                            <span className="text-5xl md:text-6xl mb-2 drop-shadow-md">{group.icon}</span>
                                            <h3 className="text-2xl md:text-3xl font-extrabold text-white mb-1.5">{group.name}</h3>
                                            {respondentCount !== undefined && (
                                                <span className="px-3.5 py-1 rounded-full bg-white/15 text-white/90 text-sm md:text-base font-semibold">
                                                    참여 {respondentCount.toLocaleString()}명
                                                </span>
                                            )}
                                        </div>

                                        <div className="my-3 md:my-5 text-center">
                                            <span className="text-5xl md:text-6xl font-black text-white number-counter glow tracking-tight">
                                                {animatedRate.toFixed(1)}%
                                            </span>
                                            <p className="text-sm md:text-base text-white/75 font-semibold mt-1">
                                                응답 참여 완료
                                            </p>
                                        </div>
                                        
                                        <div className="w-full">
                                            <div className="h-5 md:h-6 bg-white/20 rounded-full overflow-hidden mb-2 p-0.5">
                                                <div 
                                                    className="h-full rounded-full progress-animate relative"
                                                    style={{ 
                                                        width: `${Math.min(rate, 100)}%`,
                                                        backgroundColor: group.color 
                                                    }}
                                                >
                                                    <div className="absolute inset-0 bg-white/30 animate-pulse"></div>
                                                </div>
                                            </div>
                                            <div className="flex justify-between items-center text-xs md:text-sm text-white/70 font-bold px-1">
                                                <span>0%</span>
                                                <span className="text-yellow-300 font-extrabold">목표 100%</span>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </SlideWrapper>
            );
        };

        // Slide 4: Category Change Slide
        const CategoryChangeSlide = ({ schoolData }) => {
            const { categoryData, academicYear } = schoolData;
            const prevYear = String(parseInt(academicYear) - 1);
            
            return (
                <SlideWrapper className="text-center">
                    <div className="w-full max-w-[94rem] mx-auto fade-in-scale flex flex-col justify-center">
                        <SlideTitle subtitle={`${prevYear}학년도 대비 ${academicYear}학년도 주요 영역별 점수 추이`}>📊 카테고리별 만족도 변화</SlideTitle>
                        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 md:gap-4 mt-3 md:mt-4">
                            {categoryData.map((cat, idx) => {
                                const currentScore = cat[academicYear] || cat['2025'] || 0;
                                const prevScore = cat[prevYear] || cat['2024'] || 0;
                                const change = (currentScore - prevScore).toFixed(2);
                                const isPositive = parseFloat(change) >= 0;
                                const percentScore = ((currentScore / 5) * 100).toFixed(0);
                                return (
                                    <div 
                                        key={idx} 
                                        className={`bg-white/10 backdrop-blur-xl rounded-2xl p-4 md:p-5 border border-white/20 slide-up-bounce card-3d flex flex-col justify-between min-h-[140px] md:min-h-[165px]`}
                                        style={{ animationDelay: `${idx * 100}ms` }}
                                    >
                                        <div className="flex justify-between items-start mb-2">
                                            <div className="text-left flex-1 mr-3">
                                                <span className="text-xs font-bold px-2.5 py-0.5 bg-white/20 rounded-lg text-white/90 uppercase tracking-wider mb-1 inline-block">
                                                    영역 0{idx + 1}
                                                </span>
                                                <p className="text-lg md:text-2xl text-white font-extrabold leading-snug">{cat.name}</p>
                                            </div>
                                            <span className={`text-sm md:text-base px-2.5 py-1 rounded-xl font-black shrink-0 ${isPositive ? 'bg-green-500/30 text-green-300 border border-green-400/40' : 'bg-red-500/30 text-red-300 border border-red-400/40'}`}>
                                                {isPositive ? '▲ +' : '▼ '}{change}점
                                            </span>
                                        </div>

                                        <div className="flex items-center justify-between my-2 bg-white/5 p-2.5 md:p-3 rounded-xl border border-white/10">
                                            <div className="text-left">
                                                <p className="text-xs text-white/60 font-semibold">{prevYear}년도</p>
                                                <p className="text-lg md:text-xl text-white/70 font-bold">{prevScore.toFixed(2)}</p>
                                            </div>
                                            <span className="text-xl md:text-2xl text-white/40 font-bold">→</span>
                                            <div className="text-right">
                                                <p className="text-xs text-indigo-300 font-bold">{academicYear}년도</p>
                                                <p className="text-2xl md:text-3xl font-black text-white glow">{currentScore.toFixed(2)}<span className="text-xs md:text-sm text-white/60 font-normal"> / 5.0</span></p>
                                            </div>
                                        </div>

                                        <div className="w-full mt-1">
                                            <div className="h-2.5 md:h-3 bg-white/20 rounded-full overflow-hidden p-0.5">
                                                <div 
                                                    className="h-full bg-gradient-to-r from-indigo-400 to-purple-500 rounded-full progress-animate"
                                                    style={{ width: `${(currentScore / 5) * 100}%` }}
                                                ></div>
                                            </div>
